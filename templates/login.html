<!DOCTYPE html><html lang="pt-br"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Login - Clínica Vida</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body class="login-page"><main class="login-card"><div class="brand-mark">CV</div><h1>Clínica Vida</h1><p class="muted">Acesse o sistema de gerenciamento</p>{% if erro %}<div class="alert erro">{{ erro }}</div>{% endif %}<form action="{{ url_for('login') }}" method="POST"><div class="form-group"><label for="email">E-mail</label><input type="email" id="email" name="email" autocomplete="username" required></div><div class="form-group"><label for="senha">Senha</label><input type="password" id="senha" name="senha" autocomplete="current-password" required></div><button type="submit" class="full-width">Entrar no sistema</button></form><small class="muted">Acesso de demonstração: rhian@email.com · senha 123456</small></main></body></html>
